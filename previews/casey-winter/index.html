<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casey skin preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#0f172a;font:15px system-ui,sans-serif}main{max-width:1100px;margin:50px auto;background:white;border:1px solid #d7dee8;border-radius:14px;overflow:hidden}header{padding:20px 24px;background:#f8fafc;border-bottom:1px solid #d7dee8}h1{margin:0 0 8px;font-size:21px}.note{color:#475569;margin:0}.toolbar{padding:16px 24px;display:flex;gap:12px;align-items:center}.toolbar button{border:1px solid #d7dee8;border-radius:8px;padding:7px 14px;background:#fff;cursor:pointer}.toolbar button[aria-pressed=true]{background:#2563eb;color:white}.stage{display:grid;grid-template-columns:repeat(3,1fr);min-height:260px;margin:0 24px 24px;border:1px solid #d7dee8;border-radius:10px;background:#f9fbfe}.column{display:flex;justify-content:center;align-items:center;border-right:1px dashed #d7dee8}.column:last-child{border:0}.figure-group{transform:translateY(-10px);text-align:center}.scene{position:relative;width:111.8px;height:113.35px;overflow:hidden;margin:auto}.sprite{position:absolute;width:1800%;height:100%;left:0;top:0;max-width:none;animation:walk 1.8s steps(18,end) infinite}.ground{position:absolute;top:86.363636%;left:0;width:200%;height:10.909091%;background:url('../../assets/casey-name-search/ground.png') repeat-x;background-size:50% 100%;animation:ground 6.5s linear infinite}.caption{font:600 16.8px/1.25 system-ui,sans-serif;margin:4.8px 0 0;color:#475569}.stage.large{min-height:360px}.large .scene{width:223.6px;height:226.7px}.paused .sprite,.paused .ground{animation-play-state:paused}@keyframes walk{to{transform:translateX(-100%)}}@keyframes ground{to{transform:translateX(-50%)}}footer{padding:16px 24px;background:#f8fafc;color:#475569;border-top:1px solid #d7dee8}
</style><main><header><h1>Casey — skin preview</h1><p class="note">Local preview · Figure and caption raised 10 screen pixels · Original walking frames preserved</p></header><div class="toolbar"><button id="original" aria-pressed="false">Original</button><button id="winter" aria-pressed="true">Winter</button><button id="zoom">View at 2× size</button><button id="pause">Pause animation</button></div><section class="stage" aria-label="Three pass positions"></section><footer>Caption changes only. Production status-bar messages and installable userscript remain unchanged.</footer></main><script>
const titles=['1/3 - Criminal','2/3 - Traffic/Municipal','3/3 - Municourt'];
let skin='winter';
const roots={original:'../../assets/casey-name-search/',winter:'../../assets/casey-name-search/skins/winter/'};
const stage=document.querySelector('.stage');
function render(){stage.innerHTML=titles.map(title=>`<div class="column"><div class="figure-group"><div class="scene"><div class="ground" style="background-image:url('${roots[skin]}ground.png')"></div><img class="sprite" src="${roots[skin]}sprite.png" alt="Casey walking, ${skin} skin"></div><p class="caption">${title}</p></div></div>`).join('');for(const id of ['original','winter'])document.getElementById(id).setAttribute('aria-pressed',String(skin===id));}
for(const id of ['original','winter'])document.getElementById(id).onclick=()=>{skin=id;render()};
document.querySelector('#pause').onclick=e=>{const paused=stage.classList.toggle('paused');e.target.textContent=paused?'Play animation':'Pause animation'};
document.querySelector('#zoom').onclick=e=>{const large=stage.classList.toggle('large');e.target.textContent=large?'View at actual size':'View at 2× size'};
render();
</script></html>
